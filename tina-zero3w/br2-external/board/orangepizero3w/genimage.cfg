# SD 卡布局（与 e902/FLASHING.md 已验证布局一致）：
#   8 KiB      boot0（DRAM 初始化，Zero 3W 专用变体）
#   16400 KiB  boot_package（u-boot + bl31 + vendor-scp.bin，bootpkg.py 已换槽）
#   24 MiB     rootfs（ext4，/boot 在其中）
image sdcard.img {
	hdimage {
	}

	partition boot0 {
		in-partition-table = "no"
		image = "boot0_sdcard.fex"
		offset = 8K
	}

	partition boot_package {
		in-partition-table = "no"
		image = "boot_package.fex"
		offset = 16400K
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 24M
	}
}
