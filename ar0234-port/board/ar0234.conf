# /etc/ar0234.conf -- AR0234 fixed-mode configuration (read by ar0234-3ad at
# stream start). Everything below is a commented-out sample; the shipped
# default is auto mode, which keeps the AE/AWB behaviour unchanged.
#
# mode = fixed           pins exposure, gain and AWB for every streaming program
# params = industrial    force the ISP parameter set: 3dnr | no3dnr | industrial
#                        (automatic choice installs no3dnr at 1920x1200@>110)
# exposure_lines = 147   exposure in sensor lines; one line = 6.8 us on every
#                        mode (hts 612 / pclk 90 MHz, ar0234_mipi.c)
# exposure_us = 1000     same, in microseconds (give at most one of the two)
# gain = 4.0             sensor gain, x (1.0 .. 255.9)
# awb = fixed            pin white balance ...
# wb_temperature = 5000  ... to this colour-temperature preset (kelvin)
# ae_log = 1             libisp logs EXP_TIME/AGAIN/WB Gain lines to the
#                        ar0234-3ad journal while the stream runs
#
# Industrial example (fixed exposure, gain 4x, AWB pinned to 5000 K, the
# linear industrial parameter set, AE log on):
#
#   mode = fixed
#   exposure_lines = 147
#   gain = 8.0
#
# mode = auto
