# Orange Pi Zero 3W (A733 / sun60iw2) —— 一次性构建配置
#
# 用法：
#   sudo ./build.sh a733                     # 整机可刷镜像（用下面的默认值）
#   sudo ./build.sh a733 BUILD_OPT=u-boot    # 只重打 u-boot（含 E902 scp.fex 打包）
#   sudo ./build.sh a733 BUILD_OPT=kernel    # 只重编内核
#   sudo ./build.sh a733 BUILD_OPT=rootfs    # 只重建 rootfs + 全部 deb
#
# 命令行上的 VAR=value 会覆盖这里的值（build.sh 在 source 本文件之后才解析参数）。

# ---- 目标 ----
BOARD="orangepizero3w"
BRANCH="current"		# 6.6.x BSP 内核（orange-pi-6.6-sun60iw2）
RELEASE="bookworm"

# ---- 内核配置 ----
# no = 不弹 menuconfig，直接用 userpatches/linux-sun60iw2-current-a733.config
#      （该文件的优先级高于 external/config/kernel/ 里的同名文件）
KERNEL_CONFIGURE="no"
KERNEL_KEEP_CONFIG="no"		# 不复用 output/config/ 里的旧 .config，避免拿到非 RT 的那份
INSTALL_HEADERS="yes"		# 出 linux-headers deb，方便之后编外部模块

# ---- 镜像类型 ----
BUILD_OPT="image"		# image = u-boot + kernel + rootfs + 组装 .img
BUILD_MINIMAL="yes"		# 最小 CLI 镜像
BUILD_DESKTOP="no"

# ---- 缓存与清理 ----
# debs  = 删掉本分支的旧 deb（内核/u-boot 会重编，这是 RT 配置能生效的关键）
# oldcache = 只保留最新 8 份 rootfs 缓存
# 不想重编 u-boot 时改成 CLEAN_LEVEL="oldcache"
CLEAN_LEVEL="debs,oldcache"

# ---- 输出 ----
# 默认值是 sha,gpg,img；gpg 需要签名密钥，无人值守会卡住，所以这里去掉 gpg
COMPRESS_OUTPUTIMAGE="sha,img"

# ---- 其它 ----
EXTERNAL_NEW="prebuilt"
USE_TORRENT="no"		# 不依赖 torrent 客户端
DOWNLOAD_MIRROR="china"
GITEE_SERVER="no"

# ============================================================================
# 下面这些默认没打开，需要时取消注释即可（命令行加同名参数效果一样）
# ============================================================================

# 让整机镜像自带你自己的 E902 工具/脚本：
#   userpatches/overlay/  -> 构建时只读挂到 chroot 的 /tmp/overlay
#   userpatches/customize-image.sh  -> 在 chroot 里执行，
#                                      参数 $RELEASE $LINUXFAMILY $BOARD $BUILD_DESKTOP $ARCH
#   userpatches/customize-image-host.sh -> 在宿主机、挂载 overlay 之前执行

# 重打 u-boot 时额外产出一个可直接 dd 回 SD 的整块 blob
# （20MB；boot0 在 8K，boot_package 在 2050*8K，与镜像内部布局一致）
#MERGE_UBOOT="yes"

# 顺带导出 defconfig，方便复现/对比（写进 output/config/）
#KERNEL_EXPORT_DEFCONFIG="yes"

# 交付给别人的镜像改掉默认凭据（默认 orangepi/orangepi，root/orangepi）
#OPI_USERNAME="orangepi"
#OPI_PWD="orangepi"
#ROOTPWD="orangepi"
#HOST="orangepizero3w"		# 镜像主机名

# 反复迭代时省时间：deb 不压缩
#DEB_COMPRESS="none"

# rootfs / 分区微调
#ROOTFS_TYPE="ext4"		# 也可 btrfs 等
#EXTRA_ROOTFS_MIB_SIZE="0"	# 额外多留多少 MiB 给根分区
#IMAGE_PARTITION_TABLE="msdos"

# 无人值守/离线
#OFFLINE_WORK="yes"		# 跳过源/时间/宿主检查
#IGNORE_UPDATES="yes"		# 不 fetch 那些 git 仓库（改过树内源码时有用）
#PROGRESS_LOG_TO_FILE="yes"	# 编译日志完整落盘
#OUTPUT_VERYSILENT="yes"	# 极简输出（配合日志）
