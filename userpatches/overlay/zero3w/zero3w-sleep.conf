# Suspend = s2idle by default (tmpfiles.d, applied at boot).
# "deep" enters the firmware (bl31 + E902 SCP) and never wakes on this board:
# tested 2026-09-29 with an RTC alarm (and earlier with WoWLAN), the board
# stays down until power-cycled. s2idle wakes on the RTC alarm, WiFi comes
# back. Keep "deep" off until the SCP standby path is debugged.
w /sys/power/mem_sleep - - - - s2idle
