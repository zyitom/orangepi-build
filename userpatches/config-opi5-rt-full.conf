# Orange Pi 5 (RK3588S) —— jammy + XFCE 桌面 + RT 内核 全功能镜像
#
# 与 config-opi5-noble 的差别:RELEASE=jammy(厂商用户态包 rk35xx_packages 只覆盖到
# jammy,构建时 rk35xx_gpu_vpu_tweaks 会自动装 libmali G610 / librockchip-mpp /
# gstreamer-rockchip / chromium / ffmpeg / rkaiq 相机等)+ 桌面。
#
# 无头构建(必须绕开 config-docker.conf 的 -it,否则 pv 光标查询会死锁):
#   docker run --rm --cap-add=SYS_ADMIN --cap-add=MKNOD --cap-add=SYS_PTRACE \
#     --security-opt=apparmor:unconfined --device /dev/loop-control \
#     --device-cgroup-rule='b 7:* rmw' --device-cgroup-rule='b 259:* rmw' \
#     -v /dev:/tmp/dev:ro -v /home/zyi/Desktop/orangepi5-build:/root/orangepi \
#     -v orangepi-cache:/root/orangepi/cache -v orangepi-ccache:/root/.ccache \
#     -e COLUMNS=200 -e LINES=50 -e TERM=dumb \
#     orangepi:latest rt-full BUILD_OPT=image IGNORE_UPDATES=yes
#
# 有真终端时也可以: sudo ./build.sh rt-full BUILD_OPT=image IGNORE_UPDATES=yes

# ---- 目标 ----
BOARD="orangepi5"
BRANCH="current"			# 6.1.x BSP 内核,RT userpatch 自动生效
RELEASE="jammy"				# 厂商栈支持的最新 release

# ---- 内核配置 ----
KERNEL_CONFIGURE="no"
KERNEL_KEEP_CONFIG="no"
INSTALL_HEADERS="yes"

# ---- 镜像类型 ----
BUILD_OPT="image"
BUILD_MINIMAL="no"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT="xfce"
DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"

# ---- 缓存与清理 ----
CLEAN_LEVEL="debs,oldcache"

# ---- 输出 ----
COMPRESS_OUTPUTIMAGE="sha,img"

# ---- 其它 ----
EXTERNAL_NEW="prebuilt"
USE_TORRENT="no"
DOWNLOAD_MIRROR="china"
GITEE_SERVER="no"
NO_APT_CACHER="yes"
